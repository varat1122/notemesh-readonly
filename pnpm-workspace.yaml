allowBuilds:
  "@parcel/watcher": true
  better-sqlite3: true
  esbuild: true
minimumReleaseAgeExclude:
  - better-sqlite3@13.0.2
  - hono@4.12.34

# Security patches for transitive dependencies. Each is the lowest version that
# clears an advisory reported by `pnpm audit`, pinned within the major line the
# framework targets rather than jumping to an RC.
overrides:
  h3: ^1.15.11 # path traversal, SSE injection, request smuggling
  hono: ^4.12.34 # ReDoS in CORS middleware
  fast-uri: ^3.1.6 # host confusion via backslash; 3.1.6 also clears the four 2026 URI-parsing advisories (#62)
  qs: ^6.16.0 # prototype pollution and DoS in query parsing, reached only through the MCP SDK's Express (#62)
  brace-expansion: ^2.1.6 # nested brace recursion and intermediate-array DoS
  nanoid: ^3.3.17 # custom generators loop forever when size is zero
  seroval: ^1.6.9 # unsafe JSON deserialization and unchecked TypedArray sizes
  source-map-js: ^1.2.2 # indexed source-map section offset DoS
  proxy-addr: ^2.0.8 # IPv4-mapped IPv6 trust-subnet spoofing
  follow-redirects: ^1.16.1 # GHSA-q3jh-wrc6-jgq8 / GHSA-8r9p-f939-6h3c; credential header handling
  body-parser: ^2.4.0 # GHSA-27r3-jxmh-p828; compressed body trailing bytes
  vite: ^6.4.4 # GHSA-587h-7wmj-h5pm; keep Vite 6, verify Vinxi compatibility
  zod: ^4.6.6 # GHSA-mrhx-c7xc-m3w5; experimental major migration only
  node-forge: 1.4.3 # patched 2026-11, including Ed25519 fixed after 1.4.1

# CI fails on a high or critical advisory in a production dependency. An
# advisory that has been reviewed and found not to apply goes here, with
# the reason, and comes out when the fix lands.
audit:
  # Reviewed 2026-11-13: the node-forge advisory exception was removed
  # after pinning patched 1.4.3. A separate historical exception remains for
  # build-time braces; production runtime exclusion tests remain mandatory.
  # See docs/SAFE_EDIT_TEST_REPORT.md. Do not use vinxi dev/start in production.
  ignore:
    - GHSA-vfj7-8cjw-p6xm # braces / CVE-2026-93687
