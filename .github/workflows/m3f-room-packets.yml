name: Gold-free M3 Room Input Pack (NO EVAL / NO VAULT)

on:
  push:
    branches:
      - feat/m3f-room-packets-artifact-20261027
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-export:
    name: Offline Gold-free Export — NO model / no Vault
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Export six Gold-free room inputs and verify labels absent
        run: node --experimental-strip-types scripts/build-m3-room-input-artifact.mjs
      - name: Upload ready-to-use room input ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: M3_Gold_Free_Room_Inputs_6_JSON_NO_RESULTS
          path: m3-room-input-artifacts/
          retention-days: 7
          if-no-files-found: error
