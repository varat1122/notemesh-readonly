# TEMPORARY / DEVELOPMENT BRANCH ONLY — no Production workflow.
# One-shot lockfile regeneration on a restricted branch; remove after evaluation.
name: M551 Zod 4 compatibility probe

on:
  push:
    branches:
      - feat/m551-zod4-compat-probe-20261027

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.ref == 'refs/heads/feat/m551-zod4-compat-probe-20261027'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/m551-zod4-compat-probe-20261027
          persist-credentials: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Generate lockfile in isolated test branch
        run: |
          pnpm --version
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          git diff --stat -- pnpm-lock.yaml
          git status --short
      - name: Commit regenerated lockfile ONLY to test branch
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already matches overrides"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(probe): regenerate lockfile for patched transitive deps"
          git push origin HEAD:refs/heads/feat/m551-zod4-compat-probe-20261027
      - name: Audit remaining advisories (probe only; cannot certify release)
        run: |
          pnpm audit --prod --audit-level=high || echo "PROBE: Audit remains red; do not merge/deploy"
