name: Staging control image

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  staging-control-image:
    if: github.head_ref == 'fix/ios-staging-control-path-001'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate and build the exact Railway Dockerfile
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          selected=$(node scripts/check-staging-control-config.mjs)
          docker build --check -f "$selected" .
          docker build --progress=plain -f "$selected" \
            --build-arg "RAILWAY_GIT_COMMIT_SHA=$CANDIDATE_SHA" \
            --build-arg RAILWAY_GIT_BRANCH=fix/ios-staging-control-path-001 \
            -t "ios-staging-control:$CANDIDATE_SHA" .
      - name: Verify artifact, canary admission, and final image layers
        run: python3 scripts/verify-staging-control-image.py "ios-staging-control:$CANDIDATE_SHA" "$CANDIDATE_SHA"
