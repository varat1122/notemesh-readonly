name: IOS Prices isolated node-forge lockfile regeneration (NO DEPLOY)
on:
  push:
    branches:
      - feat/ios-prices-security-lockgen-20261113

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Generate exact lockfile with pnpm 11.16.0
        run: |
          set -euo pipefail
          test "$(pnpm --version)" = "11.16.0"
          grep -q 'node-forge: 1.4.3' pnpm-workspace.yaml
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          grep -q '^  node-forge@1.4.3:' pnpm-lock.yaml
          if grep -q 'node-forge@1.4.0' pnpm-lock.yaml; then
            echo "Old vulnerable version still present"; exit 1
          fi
          pnpm install --frozen-lockfile --ignore-scripts
          git diff --check
          mkdir -p lock-proof
          cp pnpm-lock.yaml pnpm-workspace.yaml lock-proof/
          (cd lock-proof && sha256sum pnpm-lock.yaml pnpm-workspace.yaml > SHA256SUMS.txt)
          git diff --stat

      - name: Verify production dependency audit (blocking)
        run: pnpm audit --prod --audit-level=high

      - name: Upload generated lock and non-secret proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-prices-nodeforge143-lockfile
          path: lock-proof/
          retention-days: 7
          if-no-files-found: error
