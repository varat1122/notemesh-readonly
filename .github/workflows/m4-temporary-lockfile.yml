name: M4 temporary lockfile regeneration (remove after use)

on:
  push:
    branches:
      - fix/m4-better-auth-security-20261029

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Resolve synchronized security dependencies and lockfile
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Check pinned Better Auth versions
        run: |
          node --input-type=module -e 'import p from "./package.json" with { type: "json" }; for (const n of ["better-auth","@better-auth/api-key","@better-auth/oauth-provider"]) { if (p.dependencies[n] !== "1.7.7") process.exit(1) }'
      - name: Commit generated lockfile to this isolated branch only
        run: |
          set -eu
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Lockfile already current; no mutation needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(staging): resolve Better Auth 1.7.7 lockfile'
          git push origin HEAD:refs/heads/fix/m4-better-auth-security-20261029
