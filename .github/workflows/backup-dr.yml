name: Backup DR fixture gates
on:
  pull_request:
    paths:
      - "scripts/backup/**"
      - ".github/workflows/backup-dr.yml"
      - "docs/BACKUP_DR.md"
  workflow_dispatch:
jobs:
  fixture-backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test encrypted local snapshot and restore (fixtures only)
        run: node --test scripts/backup/*.test.mjs
